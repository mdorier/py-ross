[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "ross"
version = "0.0.1"
description = "Python bindings for ROSS (Rensselaer's Optimistic Simulation System)"
requires-python = ">=3.9"

[tool.scikit-build]
minimum-version = "0.10"
build-dir = "build/{wheel_tag}"
wheel.packages = ["python/ross"]
